name: "datawise-build-bun"
description: "datawise build bun"

inputs:
  DATAWISE_PACKAGES_TOKEN:
    required: false
    default: "invalid"

  ENABLE_LINT:
    required: false
    default: "false"
    description: "Enable lint step (true/false)"

  ENABLE_TESTS:
    required: false
    default: "false"
    description: "Enable test step (true/false)"

  TEST_CONTINUE_ON_ERROR:
    required: false
    default: "false"
    description: "If true, workflow continues even when tests fail"

  BUILD_SCRIPT:
    required: false
    default: "build"
    description: "package.json script to execute"
  APP_VERSION:
    required: false
    default: ""
    description: "Optional package.json version to set before build, for example 1.2.3 or 1.2.3-beta.1"


runs:
  using: "composite"
  steps:
    - name: Export DATAWISE_PACKAGES_TOKEN as env var
      shell: bash
      run: |
        echo "DATAWISE_PACKAGES_TOKEN=${{ inputs.DATAWISE_PACKAGES_TOKEN }}" >> $GITHUB_ENV


    - name: Read Node version from package.json
      shell: bash
      run: |
        NODE_VERSION=$(node -p "require('./package.json').engines?.node || ''")
        if [ -z "$NODE_VERSION" ]; then
          echo "package.json is missing engines.node"
        fi

        echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
        echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

        echo "=============================="
        echo " Node version from package.json"
        echo "=============================="
        echo "$NODE_VERSION"
        echo "=============================="

    - name: Setup Node.js
      if: steps.node_version.outputs.node_version != ''
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }} 

    - name: Restore node_modules cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node_modules-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-node_modules-

    - name: Restore Bun install cache
      uses: actions/cache@v4
      with:
        path: ./.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

    # you should have this for private repository in bunfig.toml
    # [install.scopes]
    # "@datawise-ai" = { token = "$DATAWISE_PACKAGES_TOKEN", url = "https://npm.pkg.github.com" }

    - name: update bunfig.toml [bun install cache]
      shell: bash
      run: |
        echo '[install.cache]'              >> bunfig.toml
        echo 'dir = "./.bun/install/cache"' >> bunfig.toml
        echo 'disableManifest = false'      >> bunfig.toml
    
    - name: Show bunfig.toml
      shell: bash
      run: cat bunfig.toml

    - name: Remove .npmrc (if exists)
      shell: bash
      run: rm -f .npmrc

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Bun install
      shell: bash
      run: bun install --frozen-lockfile


    - name: Set package version
      if: ${{ inputs.APP_VERSION != '' }}
      shell: bash
      env:
        APP_VERSION: ${{ inputs.APP_VERSION }}
      run: |
        if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "❌ Invalid application version: $APP_VERSION"
          echo "Expected examples:"
          echo "  1.2.3"
          echo "  1.2.3-beta.1"
          exit 1
        fi

        npm pkg set version="$APP_VERSION"

        ACTUAL_VERSION="$(node -p "require('./package.json').version")"

        if [[ "$ACTUAL_VERSION" != "$APP_VERSION" ]]; then
          echo "❌ Failed to set package.json version"
          echo "Expected: $APP_VERSION"
          echo "Actual:   $ACTUAL_VERSION"
          exit 1
        fi

        echo "APP_VERSION=$ACTUAL_VERSION" >> "$GITHUB_ENV"

        echo "=============================="
        echo " Application version"
        echo "=============================="
        echo "$ACTUAL_VERSION"
        echo "=============================="

        {
          echo "## 📦 Application Version"
          echo ""
          echo "\`$ACTUAL_VERSION\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Show runtime versions
      shell: bash
      run: |
        echo "=============================="
        echo " Runtime information"
        echo "=============================="
        echo "OS:        $(uname -srm)"
        echo "Node:      $(node --version)"
        echo "npm:       $(npm --version)"
        echo "Bun:       $(bun --version)"
        echo "Bun rev:   $(bun --revision)"
        echo "=============================="

        {
          echo "## 🚀 Runtime Information"
          echo ""
          echo "| Component | Version |"
          echo "|---|---|"
          echo "| OS | \`$(uname -srm)\` |"
          echo "| Node.js | \`$(node --version)\` |"
          echo "| npm | \`$(npm --version)\` |"
          echo "| Bun | \`$(bun --version)\` |"
          echo "| Bun revision | \`$(bun --revision)\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Bun Lint
      if: ${{ inputs.ENABLE_LINT == 'true' }}
      shell: bash
      run: bun run lint

    - name: Bun test
      if: ${{ inputs.ENABLE_TESTS == 'true' }}
      continue-on-error: ${{ inputs.TEST_CONTINUE_ON_ERROR == 'true' }}
      shell: bash
      run: |
        mkdir -p test-results
        bun test --reporter junit --reporter-outfile test-results/junit.xml

    - name: Test summary
      if: ${{ inputs.ENABLE_TESTS == 'true' }}
      shell: bash
      run: |
        if [ -f test-results/junit.xml ]; then

          TOTAL=$(grep -o 'tests="[0-9]*"' test-results/junit.xml | head -1 | cut -d'"' -f2)
          FAIL=$(grep -o 'failures="[0-9]*"' test-results/junit.xml | head -1 | cut -d'"' -f2)
          SKIP=$(grep -o 'skipped="[0-9]*"' test-results/junit.xml | head -1 | cut -d'"' -f2)

          PASS=$((TOTAL-FAIL-SKIP))

          echo "## 🧪 Bun Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭ Skipped | $SKIP |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧮 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY

        else
          echo "No junit.xml found" >> $GITHUB_STEP_SUMMARY
        fi

    - uses: actions/upload-artifact@v4
      if: ${{ inputs.ENABLE_TESTS == 'true' }}
      with:
        name: bun-test-results
        path: test-results/

    - name: Run ${{ inputs.BUILD_SCRIPT }}
      shell: bash
      run: bun run "${{ inputs.BUILD_SCRIPT }}"
      env:
        NODE_OPTIONS: --max-old-space-size=6144
