name: "datawise-build-bun"
description: "datawise build bun"
inputs:
  NODE_VERSION:
    required: true
  DATAWISE_PACKAGES_TOKEN:
    required: false
    default: "invalid"    
runs:
  using: "composite"
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.NODE_VERSION }}
        registry-url: 'https://npm.pkg.github.com'

    - name: BUN install cache Cache - key [bun.lock] 
      uses: actions/cache@v4
      with:
        path: "./.bun/install/cache"
        key: ${{ hashFiles('bun.lock') }}

#   you should have this for private repository in bunfig.tml
#   [install.scopes]
#   "@datawise-ai" = { token = "$DATAWISE_PACKAGES_TOKEN", url = "https://npm.pkg.github.com" }

    - name: update bunfig.tml [bun install cache] 
      shell: bash
      run: |
        echo '[install.cache]'                >> bunfig.toml
        echo 'dir = "./.bun/install/cache"'   >> bunfig.toml   # the directory to use for the cache
        echo 'disableManifest = false'        >> bunfig.toml   # when true, always resolve the latest versions from the registry

    - name: cat bunfig.tml  
      shell: bash
      run: |
        cat bunfig.toml 
        
    - name: Be sure there is no .npmrc
      shell: bash
      run: |
        rm .npmrc || true

    - name: set DATAWISE_PACKAGES_TOKEN
      shell: bash
      run: |
        echo DATAWISE_PACKAGES_TOKEN=${{ inputs.DATAWISE_PACKAGES_TOKEN }} >> $GITHUB_ENV

    - uses: oven-sh/setup-bun@v2
      shell: bash
      run: |
        bun install

    - name: Bun Lint
      shell: bash
      run: |
        bun next lint --quiet
      
    - name: Bun NEXT build
      run: bun next build
      shell: bash
